; PlatformIO Project Configuration File
; MPU-6050 Gyroscope + Accelerometer on NodeMCU ESP32-S
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    electroniccats/MPU6050 @ ^1.3.0
    Wire
   

; Build flags (optional: increase stack size if needed)
build_flags =
    -DCORE_DEBUG_LEVEL=0